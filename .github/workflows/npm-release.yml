# Publish to npm when a GitHub release is promoted from prerelease to full release.
# Downloads the npm package tarball from the release (no rebuild).
#
# AUTH: npm OIDC trusted publishing (no long-lived NPM_TOKEN — npm revoked classic
# tokens on 2026-12-09 and forces granular tokens to expire, so OIDC is the only
# durable option). Requires a ONE-TIME setup on npmjs.com for EACH package below;
# until that is done a publish fails with E404/E422. For both `lattish` and
# `@tishlang/lattish`, open npmjs.com > the package > Settings > "Trusted Publisher"
# > GitHub Actions and set:
#   Organization or user: tishlang
#   Repository:           lattish
#   Workflow filename:    npm-release.yml
#   Environment:          (leave blank)
# Requires npm >= 11.5.1 (upgraded below) and the id-token: write permission.

name: NPM release

on:
  release:
    types: [published, edited]

jobs:
  publish:
    name: Publish to npm
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to update release body via API
      id-token: write   # required for npm OIDC trusted publishing
    env:
      # No NODE_AUTH_TOKEN — auth is via OIDC (see trusted-publishing note at top).
      # Provenance is disabled because the packages publish from pre-built tarballs
      # (built in a separate workflow, not this run), the fragile case for provenance.
      # To enable it later, remove this line and confirm the tarball publishes still pass.
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Download npm package tarballs from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS='${{ toJSON(github.event.release.assets) }}'
          LATTISH_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name == "lattish-npm-package.tgz") | .url')
          TISHLANG_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name == "tishlang-lattish-npm-package.tgz") | .url')
          if [ -z "$LATTISH_URL" ] || [ "$LATTISH_URL" = "null" ]; then
            echo "Release has no asset lattish-npm-package.tgz"
            exit 1
          fi
          curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/octet-stream" "$LATTISH_URL" -o lattish-npm-package.tgz
          if [ -n "$TISHLANG_URL" ] && [ "$TISHLANG_URL" != "null" ]; then
            curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/octet-stream" "$TISHLANG_URL" -o tishlang-lattish-npm-package.tgz
            echo "HAS_TISHLANG=true" >> $GITHUB_ENV
          else
            echo "HAS_TISHLANG=false" >> $GITHUB_ENV
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: |
          # Pinned to the 11.x line, NOT `npm@latest` / 12.x. npm 12.0.0 (2026-07-09) is
          # independently broken for publishing regardless of Node version: its own
          # package.json lists `sigstore` in bundleDependencies, but the published tarball
          # omits it, and libnpmpublish's publish path requires it unconditionally at module
          # load (even with NPM_CONFIG_PROVENANCE=false, which this workflow already sets) —
          # every `npm publish` crashes with `Cannot find module 'sigstore'`. Confirmed via
          # local reproduction in tishlang/tish (see tishlang/tish#480). npm 11.18.0 (latest
          # 11.x) has sigstore bundled correctly, publishes cleanly, and still satisfies the
          # >=11.5.1 OIDC trusted-publishing requirement above. Revisit floating to `@latest`
          # once upstream ships a patched 12.0.x.
          npm install -g "npm@^11"
          npm --version

      - name: Publish lattish to npm
        run: npm publish lattish-npm-package.tgz --access public

      - name: Publish @tishlang/lattish to npm
        if: env.HAS_TISHLANG == 'true'
        run: npm publish tishlang-lattish-npm-package.tgz --access public

      - name: Update release description with npm URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          NPM_URL="https://www.npmjs.com/package/lattish/v/${VERSION}"
          TISHLANG_NPM_URL="https://www.npmjs.com/package/@tishlang/lattish/v/${VERSION}"
          RELEASE_ID="${{ github.event.release.id }}"
          REPO="${{ github.repository }}"
          # Fetch current release body from API (more reliable than event for large bodies)
          CURRENT_BODY=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" | jq -r '.body // ""')
          NEW_BODY="${CURRENT_BODY}

          ---
          Published to npm: ${NPM_URL} | ${TISHLANG_NPM_URL}"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" \
            -d "$(printf '%s' "$NEW_BODY" | jq -Rs '{body: .}')"
